<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style_image.css">
    <style>
        .img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            /* border-radius: 10px; */
        }

        .gallery {
            display: grid;
            grid-template-columns: auto auto;
            place-items: center;
            justify-content: center;

        }

        .container {
            /* background-color: rgb(170, 154, 154); */
            /* padding: 10px; */
            border: 2px solid rgb(192, 186, 186);
            margin: 10px;
        }



        .container p {
            /* align-items: center; */
            text-align: center;
            font-size: 20px;
        }

        H1 {
            text-align: center;
            padding: 10px;
        }

        p {
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1> My Dogs Gallery</h1>
    <div class="gallery">
        <div class="container">
            <img class="img" src="/img/dog1.jpeg">
            <p>Ziggy</p>

        </div>
        <div class="container">
            <img class="img" src="/img/dog2.jpeg">
            <p>Cocoa</p>
        </div>

    </div>
    <p>
        Click <a href="http://localhost:3000">here </a>here to go back.
    </p>

</body>

</html>
